# Збирання Windows-версії (ArtPhoenixStudio.exe + ArtPhoenixStudio-cli.exe) на GitHub Actions.
# Запускається ТІЛЬКИ ВРУЧНУ: GitHub -> вкладка Actions -> «Збирання Windows» -> Run workflow.
name: Збирання Windows (ArtPhoenix Studio)

on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: "Запустити тести перед збиранням"
        type: boolean
        default: true

permissions:
  contents: write          # потрібно, щоб опублікувати збірку в розділі Releases

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      UV_PROJECT_ENVIRONMENT: .venv-build
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Залежності (uv sync, Python 3.12, група build)
        run: uv sync --python 3.12 --no-dev --group build

      - name: Тести
        if: ${{ inputs.run_tests }}
        run: |
          uv run --no-sync --with pytest python -m pytest -q

      - name: PyInstaller
        run: uv run --no-sync pyinstaller packaging/pbn.spec --noconfirm --clean --distpath dist --workpath build

      - name: Самоперевірка зібраної програми
        run: dist/ArtPhoenixStudio/ArtPhoenixStudio-cli.exe --selftest

      - name: Архів
        shell: pwsh
        run: Compress-Archive -Path dist/ArtPhoenixStudio -DestinationPath dist/ArtPhoenixStudio-windows.zip

      - name: Розмір архіву
        shell: pwsh
        run: |
          $f = Get-Item dist/ArtPhoenixStudio-windows.zip
          "Архів: $($f.Name), $([math]::Round($f.Length / 1MB, 1)) МБ" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Завантажити результат (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: ArtPhoenixStudio-windows
          path: dist/ArtPhoenixStudio-windows.zip
          if-no-files-found: error
          retention-days: 30

      - name: Опублікувати в Releases (попередній випуск)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "windows-build-${{ github.run_number }}"
          gh release create $tag dist/ArtPhoenixStudio-windows.zip --repo ${{ github.repository }} --target ${{ github.sha }} --prerelease --title "ArtPhoenix Studio для Windows (збірка ${{ github.run_number }})" --notes "Автоматична збірка з коміту ${{ github.sha }}. Розпакуйте архів і запустіть ArtPhoenixStudio.exe."
          "Завантажити: https://github.com/${{ github.repository }}/releases/tag/$tag" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
