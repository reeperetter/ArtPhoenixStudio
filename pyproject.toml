[project]
name = "paint-by-numbers"
version = "0.1.0"
authors = [{ name = "reeperetter" }]
description = "Автоматичне створення картин за номерами з фотографій (без ШІ)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "opencv-python-headless>=4.9",
    "pillow>=10.0",
    "openpyxl>=3.1",
    "reportlab>=4.0",
    "scikit-image>=0.24",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "shapely>=2.0",
]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]

[project.scripts]
paint-by-numbers = "paint_by_numbers.cli:main"
paint-by-numbers-gui = "paint_by_numbers.gui.app:main"

[dependency-groups]
dev = ["pytest>=8.0", "PySide6>=6.6"]
build = ["pyinstaller>=6.6", "PySide6-Essentials>=6.6"]       # збирання: uv sync --no-dev --group build

[tool.pytest.ini_options]
testpaths = ["tests"]
