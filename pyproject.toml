[project]
name = "paint-by-numbers"
version = "0.1.0"
description = "Автоматичне створення картин за номерами з фотографій (без ШІ)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "opencv-python-headless>=4.9",
    "pillow>=10.0",
    "scikit-image>=0.24",
    "scikit-learn>=1.5",
    "scipy>=1.13",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
